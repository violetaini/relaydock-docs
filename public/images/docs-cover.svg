    <rect x="48" y="62" width="154" height="88" rx="19" fill="white"/><text x="125" y="99" text-anchor="middle" font-size="20" fill="#504368">部署与接入</text><text x="125" y="126" text-anchor="middle" font-size="15" fill="#8a8099">控制端 · Agent</text>
    <rect x="358" y="62" width="154" height="88" rx="19" fill="white"/><text x="435" y="99" text-anchor="middle" font-size="20" fill="#504368">节点与转发</text><text x="435" y="126" text-anchor="middle" font-size="15" fill="#8a8099">入口 · 域名 · 路由</text>
    <rect x="48" y="280" width="154" height="88" rx="19" fill="white"/><text x="125" y="317" text-anchor="middle" font-size="20" fill="#504368">用户与订阅</text><text x="125" y="344" text-anchor="middle" font-size="15" fill="#8a8099">授权 · 个人凭据</text>
    <rect x="358" y="280" width="154" height="88" rx="19" fill="white"/><text x="435" y="317" text-anchor="middle" font-size="20" fill="#504368">维护与排错</text><text x="435" y="344" text-anchor="middle" font-size="15" fill="#8a8099">备份 · 更新 · 日志</text>
