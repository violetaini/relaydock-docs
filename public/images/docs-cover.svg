<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">RelayDock 文档导航示意</title><desc id="desc">控制端连接服务器、节点和用户，文档覆盖部署与运维流程。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ece8fa"/><stop offset="1" stop-color="#eaf3f2"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#6b5a93" flood-opacity=".12"/></filter></defs>
  <rect x="30" y="20" width="500" height="380" rx="90" fill="url(#bg)"/>
  <g fill="none" stroke="#aa9dcd" stroke-width="2" stroke-dasharray="6 6"><path d="M280 200V110H130"/><path d="M280 200V110H430"/><path d="M280 200V320H130"/><path d="M280 200V320H430"/></g>
  <g font-family="Microsoft YaHei, sans-serif" filter="url(#shadow)">
