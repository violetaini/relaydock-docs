<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="595" viewBox="0 0 1120 595" role="img" aria-label="四类资源：服务器、入站、节点与授权"><title>四类资源：服务器、入站、节点与授权</title><desc>资源存在、控制通道在线、用户被授权，是不同条件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9587b5"/></marker></defs><rect width="1120" height="595" rx="20" fill="#f6f5fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="44" y="52" font-size="28" font-weight="700" fill="#312c43">四类资源：服务器、入站、节点与授权</text><text x="44" y="85" font-size="17" fill="#70697f">资源存在、控制通道在线、用户被授权，是不同条件。</text><rect x="44" y="130" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="165" r="17" fill="#7060a8"/><text x="79" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="white">1</text><text x="108" y="172" font-size="22" font-weight="700" fill="#353044">控制端</text><text x="66" y="212" font-size="18" font-weight="400" fill="#655e75">网页、API、账号与存储</text><text x="66" y="241" font-size="18" font-weight="400" fill="#655e75">向 Agent 下发管理操作</text><rect x="409" y="130" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="444" cy="165" r="17" fill="#7060a8"/><text x="444" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="white">2</text><text x="473" y="172" font-size="22" font-weight="700" fill="#353044">服务器 / Agent</text><text x="431" y="212" font-size="18" font-weight="400" fill="#655e75">承载核心与业务监听</text><text x="431" y="241" font-size="18" font-weight="400" fill="#655e75">记录公网 IP 和节点域名</text><rect x="774" y="130" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="809" cy="165" r="17" fill="#7060a8"/><text x="809" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="white">3</text><text x="838" y="172" font-size="22" font-weight="700" fill="#353044">入站 → 节点</text><text x="796" y="212" font-size="18" font-weight="400" fill="#655e75">核心上的监听与协议</text><text x="796" y="241" font-size="18" font-weight="400" fill="#655e75">客户端使用的连接配置</text><path d="M345 207 L402 207" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M710 207 L767 207" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="360" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="395" r="17" fill="#7060a8"/><text x="79" y="401" text-anchor="middle" font-size="18" font-weight="700" fill="white">4</text><text x="108" y="402" font-size="22" font-weight="700" fill="#353044">用户账号</text><text x="66" y="442" font-size="18" font-weight="400" fill="#655e75">身份、启用状态与角色</text><text x="66" y="471" font-size="18" font-weight="400" fill="#655e75">本地登录或外部 SSO</text><rect x="409" y="360" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="444" cy="395" r="17" fill="#7060a8"/><text x="444" y="401" text-anchor="middle" font-size="18" font-weight="700" fill="white">5</text><text x="473" y="402" font-size="22" font-weight="700" fill="#353044">服务授权</text><text x="431" y="442" font-size="18" font-weight="400" fill="#655e75">套餐或自定义模式</text><text x="431" y="471" font-size="18" font-weight="400" fill="#655e75">范围、有效期与限制</text><rect x="774" y="360" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="809" cy="395" r="17" fill="#7060a8"/><text x="809" y="401" text-anchor="middle" font-size="18" font-weight="700" fill="white">6</text><text x="838" y="402" font-size="22" font-weight="700" fill="#353044">个人订阅 / 配置</text><text x="796" y="442" font-size="18" font-weight="400" fill="#655e75">过滤允许使用的资源</text><text x="796" y="471" font-size="18" font-weight="400" fill="#655e75">使用该用户自己的凭据</text><path d="M345 437 L402 437" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M710 437 L767 437" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M925 286 L925 351" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="44" y="564" font-size="18" font-weight="400" fill="#655e75">同名不建立绑定；服务器在线不授权全部用户；已有节点不等于已部署个人凭据。</text></g></svg>