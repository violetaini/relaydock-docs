<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-label="一个域名字段，在不同位置如何使用"><title>一个域名字段，在不同位置如何使用</title><desc>先分清入口服务器 A 和目标服务器 B，避免把客户端直接指向出口。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9587b5"/></marker></defs><rect width="1120" height="640" rx="20" fill="#f6f5fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="44" y="52" font-size="28" font-weight="700" fill="#312c43">一个域名字段，在不同位置如何使用</text><text x="44" y="85" font-size="17" fill="#70697f">先分清入口服务器 A 和目标服务器 B，避免把客户端直接指向出口。</text><rect x="44" y="127" width="322" height="120" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="162" r="17" fill="#7060a8"/><text x="79" y="168" text-anchor="middle" font-size="18" font-weight="700" fill="white">1</text><text x="108" y="169" font-size="22" font-weight="700" fill="#353044">直连 B 的节点分享</text><text x="66" y="209" font-size="18" font-weight="400" fill="#655e75">B 的节点域名</text><path d="M367 185 L407 185" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="414" y="127" width="660" height="120" rx="14" fill="#fff" stroke="#ded9ea"/><text x="436" y="169" font-size="22" font-weight="700" fill="#353044">origin.example.com:目标端口</text><text x="436" y="209" font-size="18" font-weight="400" fill="#655e75">保留 B 的协议和当前用户凭据</text><rect x="44" y="272" width="322" height="120" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="307" r="17" fill="#7060a8"/><text x="79" y="313" text-anchor="middle" font-size="18" font-weight="700" fill="white">2</text><text x="108" y="314" font-size="22" font-weight="700" fill="#353044">经 A 转发的客户端分享</text><text x="66" y="354" font-size="18" font-weight="400" fill="#655e75">A 的节点域名</text><path d="M367 330 L407 330" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="414" y="272" width="660" height="120" rx="14" fill="#fff" stroke="#ded9ea"/><text x="436" y="314" font-size="22" font-weight="700" fill="#353044">entry.example.com:入口端口</text><text x="436" y="354" font-size="18" font-weight="400" fill="#655e75">不能替换成 B，跳过入口</text><rect x="44" y="417" width="322" height="120" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="452" r="17" fill="#7060a8"/><text x="79" y="458" text-anchor="middle" font-size="18" font-weight="700" fill="white">3</text><text x="108" y="459" font-size="22" font-weight="700" fill="#353044">A 核心里的转发目标</text><text x="66" y="499" font-size="18" font-weight="400" fill="#655e75">B 的 IP 或节点域名</text><path d="M367 475 L407 475" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="414" y="417" width="660" height="120" rx="14" fill="#fff" stroke="#ded9ea"/><text x="436" y="459" font-size="22" font-weight="700" fill="#353044">origin.example.com:目标端口</text><text x="436" y="499" font-size="18" font-weight="400" fill="#655e75">域名模式保存主机名，受 DNS 缓存影响</text><text x="44" y="600" font-size="17" font-weight="400" fill="#655e75">改服务器域名后：新分享读取最新值；已有转发需核对并保存；历史二维码不会自行更新。</text></g></svg>