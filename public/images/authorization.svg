<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-label="用户授权：身份验证之后，还要分配可用服务"><title>用户授权：身份验证之后，还要分配可用服务</title><desc>登录成功不等于可以管理服务器，也不等于可以使用全部节点。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9587b5"/></marker></defs><rect width="1120" height="610" rx="20" fill="#f6f5fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="44" y="52" font-size="28" font-weight="700" fill="#312c43">用户授权：身份验证之后，还要分配可用服务</text><text x="44" y="85" font-size="17" fill="#70697f">登录成功不等于可以管理服务器，也不等于可以使用全部节点。</text><rect x="44" y="130" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="165" r="17" fill="#7060a8"/><text x="79" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="white">1</text><text x="108" y="172" font-size="22" font-weight="700" fill="#353044">账号身份</text><text x="66" y="212" font-size="18" font-weight="400" fill="#655e75">本地登录 / OAuth / OIDC</text><text x="66" y="241" font-size="18" font-weight="400" fill="#655e75">账号状态、角色与映射</text><rect x="409" y="130" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="444" cy="165" r="17" fill="#7060a8"/><text x="444" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="white">2</text><text x="473" y="172" font-size="22" font-weight="700" fill="#353044">选择授权模式</text><text x="431" y="212" font-size="18" font-weight="400" fill="#655e75">套餐授权 或 自定义授权</text><text x="431" y="241" font-size="18" font-weight="400" fill="#655e75">两种模式按政策互斥</text><rect x="774" y="130" width="300" height="155" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="809" cy="165" r="17" fill="#7060a8"/><text x="809" y="171" text-anchor="middle" font-size="18" font-weight="700" fill="white">3</text><text x="838" y="172" font-size="22" font-weight="700" fill="#353044">指定服务与范围</text><text x="796" y="212" font-size="18" font-weight="400" fill="#655e75">固定节点 / 服务器 / 转发</text><text x="796" y="241" font-size="18" font-weight="400" fill="#655e75">有效期、额度与限制</text><path d="M345 207 L402 207" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M710 207 L767 207" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="361" width="470" height="165" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="396" r="17" fill="#7060a8"/><text x="79" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="white">4</text><text x="108" y="403" font-size="22" font-weight="700" fill="#353044">个人凭据与开通状态</text><text x="66" y="443" font-size="18" font-weight="400" fill="#655e75">需要的凭据由受管部署流程处理</text><text x="66" y="472" font-size="18" font-weight="400" fill="#655e75">待部署时不下发所有者凭据</text><rect x="604" y="361" width="470" height="165" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="639" cy="396" r="17" fill="#7060a8"/><text x="639" y="402" text-anchor="middle" font-size="18" font-weight="700" fill="white">5</text><text x="668" y="403" font-size="22" font-weight="700" fill="#353044">用户门户与客户端</text><text x="626" y="443" font-size="18" font-weight="400" fill="#655e75">仅输出当前账号允许的资源</text><text x="626" y="472" font-size="18" font-weight="400" fill="#655e75">导入后实际验证连接与流量</text><path d="M925 286 L925 320" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M925 320 H280 V354" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M515 440 L597 440" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="44" y="578" font-size="18" font-weight="400" fill="#655e75">撤销和停用后还要核对远端与凭据状态；用户已导出的静态文件不会自行消失。</text></g></svg>