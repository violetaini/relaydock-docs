<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="625" viewBox="0 0 1120 625" role="img" aria-label="控制流与业务流：分开检查"><title>控制流与业务流：分开检查</title><desc>面板能打开，不代表客户端代理路径可用。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9587b5"/></marker></defs><rect width="1120" height="625" rx="20" fill="#f6f5fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="44" y="52" font-size="28" font-weight="700" fill="#312c43">控制流与业务流：分开检查</text><text x="44" y="85" font-size="17" fill="#70697f">面板能打开，不代表客户端代理路径可用。</text><text x="44" y="130" font-size="18" font-weight="700" fill="#7060a8">控制通道：账号、配置、状态</text><rect x="44" y="153" width="300" height="150" rx="14" fill="#fff" stroke="#ded9ea"/><text x="66" y="195" font-size="22" font-weight="700" fill="#353044">浏览器 / 管理 API</text><text x="66" y="235" font-size="18" font-weight="400" fill="#655e75">管理员与用户操作</text><text x="66" y="264" font-size="18" font-weight="400" fill="#655e75">身份与权限校验</text><rect x="409" y="153" width="300" height="150" rx="14" fill="#fff" stroke="#ded9ea"/><text x="431" y="195" font-size="22" font-weight="700" fill="#353044">RelayDock 控制端</text><text x="431" y="235" font-size="18" font-weight="400" fill="#655e75">存储、订阅、操作编排</text><text x="431" y="264" font-size="18" font-weight="400" fill="#655e75">管理连接依模式建立</text><rect x="774" y="153" width="300" height="150" rx="14" fill="#fff" stroke="#ded9ea"/><text x="796" y="195" font-size="22" font-weight="700" fill="#353044">Agent / 核心管理</text><text x="796" y="235" font-size="18" font-weight="400" fill="#655e75">执行与确认配置</text><text x="796" y="264" font-size="18" font-weight="400" fill="#655e75">上报心跳、IP 和指标</text><path d="M345 225 L402 225" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M710 225 L767 225" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="44" y="353" font-size="18" font-weight="700" fill="#427b76">业务通道：实际代理数据</text><rect x="44" y="377" width="300" height="150" rx="14" fill="#fff" stroke="#ded9ea"/><text x="66" y="419" font-size="22" font-weight="700" fill="#353044">客户端</text><text x="66" y="459" font-size="18" font-weight="400" fill="#655e75">使用个人节点配置</text><text x="66" y="488" font-size="18" font-weight="400" fill="#655e75">连接真实业务端口</text><rect x="409" y="377" width="300" height="150" rx="14" fill="#fff" stroke="#ded9ea"/><text x="431" y="419" font-size="22" font-weight="700" fill="#353044">节点 / 转发入口</text><text x="431" y="459" font-size="18" font-weight="400" fill="#655e75">按配置直连或经中继</text><text x="431" y="488" font-size="18" font-weight="400" fill="#655e75">TCP / UDP 分别验证</text><rect x="774" y="377" width="300" height="150" rx="14" fill="#fff" stroke="#ded9ea"/><text x="796" y="419" font-size="22" font-weight="700" fill="#353044">代理目标 / 出口</text><text x="796" y="459" font-size="18" font-weight="400" fill="#655e75">协议认证与路由</text><text x="796" y="488" font-size="18" font-weight="400" fill="#655e75">连接最终目标网络</text><path d="M345 450 L402 450" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M710 450 L767 450" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="44" y="583" font-size="18" font-weight="400" fill="#655e75">控制端通常不在代理数据路径中；Agent 在线、核心就绪、业务可达应逐层确认。</text></g></svg>