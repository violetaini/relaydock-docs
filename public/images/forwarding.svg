<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="615" viewBox="0 0 1120 615" role="img" aria-label="任意门绑定：入口转发，协议继承目标"><title>任意门绑定：入口转发，协议继承目标</title><desc>示例：A 的任意门把 TCP/UDP 转发到 B 的 Shadowsocks 入站。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9587b5"/></marker></defs><rect width="1120" height="615" rx="20" fill="#f6f5fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="44" y="52" font-size="28" font-weight="700" fill="#312c43">任意门绑定：入口转发，协议继承目标</text><text x="44" y="85" font-size="17" fill="#70697f">示例：A 的任意门把 TCP/UDP 转发到 B 的 Shadowsocks 入站。</text><rect x="44" y="137" width="300" height="165" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="172" r="17" fill="#7060a8"/><text x="79" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="white">1</text><text x="108" y="179" font-size="22" font-weight="700" fill="#353044">客户端</text><text x="66" y="219" font-size="18" font-weight="400" fill="#655e75">连接 entry.example.com</text><text x="66" y="248" font-size="18" font-weight="400" fill="#655e75">使用 B 协议 + 个人凭据</text><rect x="409" y="137" width="300" height="165" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="444" cy="172" r="17" fill="#7060a8"/><text x="444" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="white">2</text><text x="473" y="179" font-size="22" font-weight="700" fill="#353044">入口服务器 A</text><text x="431" y="219" font-size="18" font-weight="400" fill="#655e75">任意门监听入口端口</text><text x="431" y="248" font-size="18" font-weight="400" fill="#655e75">转发到 B 地址:目标端口</text><rect x="774" y="137" width="300" height="165" rx="14" fill="#fff" stroke="#ded9ea"/><circle cx="809" cy="172" r="17" fill="#7060a8"/><text x="809" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="white">3</text><text x="838" y="179" font-size="22" font-weight="700" fill="#353044">目标服务器 B</text><text x="796" y="219" font-size="18" font-weight="400" fill="#655e75">origin.example.com</text><text x="796" y="248" font-size="18" font-weight="400" fill="#655e75">Shadowsocks 入站认证</text><path d="M345 220 L402 220" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M710 220 L767 220" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="366" width="495" height="160" rx="14" fill="#fff" stroke="#ded9ea"/><text x="66" y="408" font-size="22" font-weight="700" fill="#353044">入口的客户端分享配置</text><text x="66" y="448" font-size="18" font-weight="400" fill="#655e75">地址 = A 的节点域名；端口 = A 入口端口</text><text x="66" y="477" font-size="18" font-weight="400" fill="#655e75">协议与个人凭据 = 继承目标 B</text><rect x="579" y="366" width="495" height="160" rx="14" fill="#fff" stroke="#ded9ea"/><text x="601" y="408" font-size="22" font-weight="700" fill="#353044">入口核心的真实转发配置</text><text x="601" y="448" font-size="18" font-weight="400" fill="#655e75">目标 = B 的服务器 IP 或节点域名</text><text x="601" y="477" font-size="18" font-weight="400" fill="#655e75">保存绑定后，列表入口跟随 B 显示</text><text x="44" y="577" font-size="17" font-weight="400" fill="#655e75">切换 B → C：目标绑定、远端配置、继承配置与 UI 分组需要一致，并等待远端确认。</text></g></svg>