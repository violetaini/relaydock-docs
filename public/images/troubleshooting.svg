<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="803" viewBox="0 0 1120 803" role="img" aria-label="分层排错：先找到失败位置，再修改配置"><title>分层排错：先找到失败位置，再修改配置</title><desc>记录时间、版本、状态码和首个错误；每次只改变一个有依据的变量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9587b5"/></marker></defs><rect width="1120" height="803" rx="20" fill="#f6f5fa"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="44" y="52" font-size="28" font-weight="700" fill="#312c43">分层排错：先找到失败位置，再修改配置</text><text x="44" y="85" font-size="17" fill="#70697f">记录时间、版本、状态码和首个错误；每次只改变一个有依据的变量。</text><rect x="44" y="122" width="1030" height="77" rx="12" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="160" r="18" fill="#7060a8"/><text x="79" y="166" text-anchor="middle" font-size="18" fill="white">1</text><text x="112" y="168" font-size="21" font-weight="700" fill="#353044">DNS 与 TLS</text><text x="315" y="167" font-size="17" font-weight="400" fill="#655e75">解析是否正确？AAAA 是否有效？证书域名与链是否匹配？</text><path d="M560 201 L560 218" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="222" width="1030" height="77" rx="12" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="260" r="18" fill="#7060a8"/><text x="79" y="266" text-anchor="middle" font-size="18" fill="white">2</text><text x="112" y="268" font-size="21" font-weight="700" fill="#353044">反代与控制端</text><text x="315" y="267" font-size="17" font-weight="400" fill="#655e75">本机后端能访问吗？502 / 504？WebSocket 升级正确吗？</text><path d="M560 301 L560 318" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="322" width="1030" height="77" rx="12" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="360" r="18" fill="#7060a8"/><text x="79" y="366" text-anchor="middle" font-size="18" fill="white">3</text><text x="112" y="368" font-size="21" font-weight="700" fill="#353044">身份与权限</text><text x="315" y="367" font-size="17" font-weight="400" fill="#655e75">401 / 403 / 429？本地凭据、账号状态、SSO 与有效期？</text><path d="M560 401 L560 418" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="422" width="1030" height="77" rx="12" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="460" r="18" fill="#7060a8"/><text x="79" y="466" text-anchor="middle" font-size="18" fill="white">4</text><text x="112" y="468" font-size="21" font-weight="700" fill="#353044">Agent 与核心</text><text x="315" y="467" font-size="17" font-weight="400" fill="#655e75">控制模式和令牌一致？Agent 在线？配置被核心接受了吗？</text><path d="M560 501 L560 518" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="522" width="1030" height="77" rx="12" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="560" r="18" fill="#7060a8"/><text x="79" y="566" text-anchor="middle" font-size="18" fill="white">5</text><text x="112" y="568" font-size="21" font-weight="700" fill="#353044">业务路径</text><text x="315" y="567" font-size="17" font-weight="400" fill="#655e75">端口、TCP/UDP、防火墙、任意门下一跳和出口是否可达？</text><path d="M560 601 L560 618" stroke="#9587b5" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="44" y="622" width="1030" height="77" rx="12" fill="#fff" stroke="#ded9ea"/><circle cx="79" cy="660" r="18" fill="#7060a8"/><text x="79" y="666" text-anchor="middle" font-size="18" fill="white">6</text><text x="112" y="668" font-size="21" font-weight="700" fill="#353044">订阅与计量</text><text x="315" y="667" font-size="17" font-weight="400" fill="#655e75">个人凭据、模板和缓存？统计范围、方向、周期是否一致？</text><text x="44" y="771" font-size="18" font-weight="400" fill="#655e75">反馈时隐藏密码、令牌、私钥与完整订阅 URI；保留脱敏结构和错误链。</text></g></svg>