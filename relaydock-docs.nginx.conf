server {
    listen 80;
    listen [::]:80;
    listen 8090;
    listen [::]:8090;
    server_name docs.chitanda.org wiki.chitanda.org docs.chitanda.net wiki.chitanda.net 170.9.59.149;

    root /www/wwwroot/relaydock-docs/.vitepress/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript text/css application/xml text/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    access_log /www/wwwlogs/relaydock-docs.log;
    error_log /www/wwwlogs/relaydock-docs.error.log;
}